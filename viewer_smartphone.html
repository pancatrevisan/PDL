<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>PDL Viewer - Smartphone</title>
        <style>
            html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #0f172a;
                background-repeat: no-repeat;
                background-size: cover;
                font-family: Arial, sans-serif;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                box-sizing: border-box;
                background-repeat: no-repeat;
                background-position: center center;
            }

            #PDLApp {
                position: relative;
                width: 390px;
                height: 760px;
                background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center center;
                border: 8px solid #111827;
                border-radius: 28px;
                overflow: hidden;
                box-shadow: 0 18px 45px rgba(0, 0, 0, 0.4);
            }

            #PDLApp::before {
                content: "";
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                width: 120px;
                height: 18px;
                background: #111827;
                border-radius: 12px;
                z-index: 20;
            }

            #PDLApp > div {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
                padding-top: 26px;
                box-sizing: border-box;
            }

            .btn-pdl {
                position: absolute;
                font-size: 14pt;
                background-color: #d93025;
                color: #fff;
                text-shadow: 1px 1px rgba(0,0,0,0.35);
                border-radius: 10px;
                padding: 8px 12px;
                border: none;
                box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            }

            .input-pdl {
                border-radius: 8px;
                border: 2px solid #2563eb;
                padding: 6px 8px;
                background: white;
            }

            .media-pdl {
                position: absolute;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
            }

            .text-pdl {
                position: absolute;
                display: block;
                width: 200px;
                color: #111827;
                line-height: 1.3;
                font-size: 12pt;
            }
        </style>

        <script src="command/CommandCenter.js"></script>
        <script src="core/PDLData.js"></script>
        <script src="core/PDLScreen.js"></script>
        <script src="core/PDLMedia.js"></script>
        <script src="core/PDLApp.js"></script>
        <script src="core/element/PDLElement.js"></script>
        <script src="core/element/PDLButton.js"></script>
        <script src="core/element/PDLDisplayMedia.js"></script>
        <script src="core/element/DisplayData.js"></script>
        <script src="command/Command.js"></script>
        <script src="command/NextScreen.js"></script>
        <script src="core/PDLAppLoader.js"></script>

        <script>
            function loadApp() {
                let req = new XMLHttpRequest();
                req.onreadystatechange = function () {
                    if (this.readyState == 4 && this.status == 200) {
                        let loader = new PDLAppLoader(req.responseText);
                        let app = loader.loadApp();
                        app.start();
                    }
                };

                req.open("GET", "xml/truco_instrucoes.xml");
                req.send();
            }
        </script>
    </head>
    <body onload="loadApp()"></body>
</html>
